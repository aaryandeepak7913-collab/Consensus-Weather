<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<title>Consensus Weather</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--g1:#3a2a12;--g2:#000;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--tx:#fff;--dim:rgba(255,255,255,.68);--blue:#7ee0c3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:"Manrope",-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(130% 55% at 50% -8%,var(--g1),transparent 70%) fixed,#000;transition:background 1s;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
body.clear{--g1:#3a2a12}body.dusk{--g1:#4a2312}body.night{--g1:#10143a}
body.cloud{--g1:#23272f}body.rain{--g1:#0f2a28}body.storm{--g1:#2a1745}body.fog{--g1:#2a2c30}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#fx i{position:absolute;display:block}
.orb{top:-90px;right:-70px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,160,.95) 0%,rgba(255,200,90,.45) 35%,transparent 70%);animation:pulse 6s ease-in-out infinite;transition:opacity 1s;opacity:.55}
body.night .orb{width:220px;height:220px;background:radial-gradient(circle,rgba(235,240,255,.9) 0%,rgba(170,190,255,.3) 32%,transparent 68%)}
body.rain .orb,body.storm .orb,body.fog .orb{opacity:0}body.cloud .orb{opacity:.35}
.cl{height:120px;border-radius:60px;background:rgba(255,255,255,.14);filter:blur(26px);opacity:0;transition:opacity 1s;animation:drift 60s linear infinite}
body.cloud .cl,body.rain .cl,body.storm .cl,body.fog .cl{opacity:1}
body.rain .cl,body.storm .cl{background:rgba(20,30,45,.35)}
.st{width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;animation:tw 3s ease-in-out infinite}
body.night .st{opacity:.8}
.dr{width:1.5px;height:16px;background:linear-gradient(transparent,rgba(200,245,235,.7));top:-20px;opacity:0;animation:fall linear infinite}
body.rain .dr,body.storm .dr{opacity:1}
body.storm::after{content:"";position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;animation:flash 7s infinite}
@keyframes pulse{50%{transform:scale(1.1);opacity:.85}}
@keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(120vw)}}
@keyframes tw{50%{opacity:.15}}
@keyframes fall{to{transform:translateY(110vh)}}
@keyframes flash{0%,92%,96%,100%{opacity:0}93%{opacity:.35}95%{opacity:.15}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-7px)}}
.a1{animation:up .7s .15s both}.a2{animation:up .7s .25s both}.a3{animation:up .7s .35s both}.a4{animation:up .7s .45s both}.a5{animation:up .7s .55s both}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 16px 40px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bar input{flex:1;min-width:0;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:16px;padding:12px 16px;color:#fff;font:inherit;font-size:15px;outline:none;transition:box-shadow .2s}
.bar input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.28)}
.bar input::placeholder{color:var(--dim)}
.bar button{width:44px;height:44px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;border-radius:14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s,background .2s}
.bar button:active{transform:scale(.92);background:rgba(255,255,255,.28)}
.bar button:focus-visible{outline:2px solid #fff}
#res{background:rgba(20,30,45,.92);border-radius:14px;margin-bottom:8px;overflow:hidden}
#res div{padding:12px 14px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.hero{text-align:center;padding:26px 0 20px;animation:up .8s both}
.hero h1{font-size:14px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.92}
.hero .ic{font-size:66px;display:block;margin-top:10px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 10px 22px rgba(0,0,0,.28))}
.hero .t{font-size:116px;font-weight:200;line-height:1;margin-left:18px;letter-spacing:-6px;background:linear-gradient(180deg,#fff 35%,rgba(255,255,255,.5));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .c{font-size:20px;font-weight:600;margin-top:2px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chips span{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sum,.card{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
.sum{padding:14px 16px;margin-bottom:12px;font-size:15px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;font-weight:500}
.sum>span{font-size:22px}

.hours{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.h{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:56px;padding:10px 4px;border-radius:16px;font-size:15px;font-weight:700}
.h.now{background:rgba(255,255,255,.2);border:1px solid var(--line)}
.h small{font-size:12px;color:var(--dim);font-weight:600}.h .i{font-size:23px}
.rb{width:5px;height:34px;border-radius:3px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.rb i{position:absolute;bottom:0;left:0;right:0;border-radius:3px;background:linear-gradient(0deg,#3fc7a6,#9bf0d8)}
.h .p{font-size:11px;color:var(--blue);height:13px;font-weight:700}
.d{display:grid;grid-template-columns:58px 34px 40px 38px 1fr 38px;align-items:center;gap:6px;padding:11px 0;font-size:16px;font-weight:700;border-top:1px solid rgba(255,255,255,.12)}
.d:first-of-type{border-top:0}
.d .i{font-size:23px;text-align:center}.d .p{font-size:12px;color:var(--blue)}.d .lo{color:var(--dim);text-align:right;font-weight:500}
.rg{height:7px;border-radius:4px;background:rgba(255,255,255,.16);position:relative}
.rg i{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#7ee0c3,#ffd27a 55%,#ff7a59);box-shadow:0 0 10px rgba(255,150,100,.4)}
.rg b{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0}
.grid b{font-size:30px;font-weight:300;display:block;letter-spacing:-1px}
.grid span{font-size:13px;color:var(--dim)}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#7ee0c3,#b79cff)}
.conf{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;box-shadow:0 0 10px currentColor}
.foot{font-size:12px;color:var(--dim);text-align:center;margin-top:18px;line-height:1.6}
a{color:#fff}
#err{text-align:center;padding:90px 20px;color:var(--dim);animation:float 2.5s ease-in-out infinite}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.need{display:flex;flex-wrap:wrap;gap:8px}.need span{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:600}
.win{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.09);font-size:15px;font-weight:600}.win:first-of-type{border-top:0}
.win small{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}.win em{font-style:normal;color:var(--blue);white-space:nowrap}
.cmi{display:flex;gap:10px;margin-bottom:8px}.cmi label{flex:1;font-size:12px;color:var(--dim);font-weight:600}
.cmi input{width:100%;margin-top:4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;padding:9px 10px;font:inherit;font-size:15px;color-scheme:dark}
.cmr{display:flex;justify-content:space-between;padding:9px 0;font-size:15px;font-weight:600;border-top:1px solid rgba(255,255,255,.09)}
.arc{width:100%;display:block}.sunrow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-weight:600;margin-top:6px}.sunrow b{display:block;color:#fff;font-size:15px;font-weight:700}
.td{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;vertical-align:middle}
.grid .wide{grid-column:1/-1}.sm{font-size:12px;color:var(--dim)}
body{padding:0;overflow:hidden}
#app{position:fixed;inset:0;z-index:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
#app::-webkit-scrollbar{display:none}
#err{margin:auto}
.pg{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 64px) 18px calc(env(safe-area-inset-bottom) + 56px);height:100%}
.pg>.card,.pg>.home{width:100%;max-width:440px;will-change:transform,opacity}
.pg>.card{max-height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;margin:0;padding:18px}
.pg>.card::-webkit-scrollbar{display:none}
.rv{opacity:0;transform:translateY(8px);transition:opacity .26s ease,transform .26s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*28ms)}
.pg.act .rv{opacity:1;transform:none}
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 20px 0}
.tb{background:none;border:0;color:#fff;font:inherit;cursor:pointer}
#pl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.85}
#mn{font-size:22px;line-height:1;padding:4px 8px;opacity:.85}
#dots{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 20px);left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:10}
#dots i{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);transition:width .25s,background .25s;cursor:pointer}
#dots i.on{width:18px;background:#fff}
#scrim{position:fixed;inset:0;z-index:15;display:none}html.menu #scrim{display:block}
#sheet{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 14px 14px;background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border-bottom:1px solid rgba(255,255,255,.1);transform:translateY(-105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
html.menu #sheet{transform:none}
.home{text-align:center}
.home .t{font-size:min(38vw,168px);font-weight:200;line-height:.95;letter-spacing:-.06em;background:linear-gradient(180deg,#fff 40%,rgba(255,255,255,.45));-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:.06em}
.yd{font-size:17px;font-weight:500;margin-top:16px;color:var(--dim)}.yd b{color:#fff;font-weight:700}
.rn{display:inline-flex;flex-direction:column;gap:8px;margin-top:38px;min-width:210px;text-align:left}
.rn small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.rn b{font-size:36px;font-weight:300;line-height:1}
.rbar{height:4px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fc7a6,#9bf0d8);border-radius:3px;transition:width .8s cubic-bezier(.2,.8,.2,1) .15s}
.pg.act .rbar i{width:var(--w)}
.meter i{width:0;transition:width .6s cubic-bezier(.2,.8,.2,1) .1s}.pg.act .meter i{width:var(--w)}
.rg i{transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1) .15s}.pg.act .rg i{transform:none}
.tile{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
.tile h2{margin-bottom:8px!important}
.grid .tile b{font-size:28px;font-weight:300;display:block;letter-spacing:-1px}
.sum2{font-size:17px;line-height:1.5;font-weight:500;margin-bottom:18px}
.card h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:700}
.hr{display:grid;grid-template-columns:56px 30px 1fr 42px 42px;align-items:center;gap:8px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-weight:600;font-size:15px}
.hr:first-of-type{border-top:0}.hr .i{font-size:20px;text-align:center}.hr .p{font-size:12px;color:var(--blue)}.hr>span:last-child{text-align:right}
.hb{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.hb i{display:block;height:100%;background:linear-gradient(90deg,#3fc7a6,#9bf0d8)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body class="clear">
<div id="top"><button id="pl" class="tb" aria-label="Change location"></button><button id="mn" class="tb" aria-label="Menu">⋯</button></div>
<div id="scrim"></div>
<div id="sheet"><div class="bar"><input id="q" placeholder="Search city" aria-label="Search city" enterkeyhint="search"><button id="home" aria-label="Home">🏠</button><button id="loc" aria-label="Use my location">📍</button><button id="sh" aria-label="Share">📤</button><button id="u" aria-label="Switch units">°C</button></div><div id="res" hidden></div></div>
<div id="app"><div id="err">Finding your forecast…</div></div>
<div id="dots"></div>
<script>
const MODELS=['ecmwf_ifs025','gfs_seamless','icon_seamless','gem_seamless','meteofrance_seamless','ukmo_seamless','jma_seamless'];
const ALL=MODELS.concat(['ecmwf_aifs025_single','cma_grapes_global','bom_access_global']);
const VARS=['temperature_2m','apparent_temperature','relative_humidity_2m','precipitation','wind_speed_10m','weather_code'];
const $=s=>document.querySelector(s);
const DEF={lat:13.0827,lon:80.2707,name:'Chennai'};
const getHome=()=>JSON.parse(localStorage.getItem('home')||'null');
let place=JSON.parse(localStorage.getItem('place3')||'null')||getHome()||DEF;
let unit=localStorage.getItem('unit')||'C',data=null;
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=a=>{if(a.length<2)return 0;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
const mode=a=>{const c={};a.forEach(x=>c[x]=(c[x]||0)+1);return +Object.keys(c).sort((x,y)=>c[y]-c[x])[0]};
const T=c=>Math.round(unit==='F'?c*9/5+32:c);
const Wd=k=>unit==='F'?Math.round(k*.621)+' mph':Math.round(k)+' km/h';

function wx(c,day){
 if(c===0)return day?['☀️','Clear','clear']:['🌙','Clear','night'];
 if(c<=2)return day?['🌤️','Partly cloudy','clear']:['☁️','Partly cloudy','night'];
 if(c===3)return['☁️','Overcast','cloud'];
 if(c<=48)return['🌫️','Fog','fog'];
 if(c<=57)return['🌦️','Drizzle','rain'];
 if(c<=67)return['🌧️','Rain','rain'];
 if(c<=77)return['🌨️','Snow','rain'];
 if(c<=82)return['🌦️','Showers','rain'];
 if(c<=86)return['🌨️','Snow showers','rain'];
 return['⛈️','Thunderstorm','storm'];
}
function wxp(c,day,p,heavy){
 if(p>=.5)return c>=95?['⛈️','Thunderstorm','storm']:(p>=.8||heavy)?['🌧️','Rain','rain']:['🌦️','Showers','rain'];
 if(p>=.3&&c<51)return day?['🌦️','Chance of rain','cloud']:['☁️','Chance of rain','cloud'];
 return wx(c,day);
}
const isDay=t=>{const h=+t.slice(11,13);return h>=6&&h<18};

const SIG=()=>({signal:AbortSignal.timeout(6000)});
async function metno(off){
 const j=await(await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${place.lat.toFixed(4)}&lon=${place.lon.toFixed(4)}`,SIG())).json();
 const m=new Map();
 j.properties.timeseries.forEach(s=>{const o=s.data.next_1_hours;if(!o)return;
  const k=new Date(Date.parse(s.time)+off*1000).toISOString().slice(0,13),d=s.data.instant.details;
  m.set(k,{t:d.air_temperature,h:d.relative_humidity,w:d.wind_speed*3.6,r:o.details.precipitation_amount})});
 if(!m.size)throw 0;return m}
async function wttr(){
 const j=await(await fetch(`https://wttr.in/${place.lat.toFixed(4)},${place.lon.toFixed(4)}?format=j1`,SIG())).json();
 const m=new Map();
 j.weather.forEach(d=>d.hourly.forEach(h=>{const hh=String(Math.round(+h.time/100)).padStart(2,'0');
  m.set(`${d.date}T${hh}`,{t:+h.tempC,h:+h.humidity,w:+h.windspeedKmph,r:+h.precipMM/3})}));
 if(!m.size)throw 0;return m}
const ENS=['ecmwf_ifs025','gfs025','gem_global','icon_seamless'];
async function ens(mod){
 const j=await(await fetch(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${place.lat}&longitude=${place.lon}&hourly=temperature_2m,precipitation&models=${mod}&forecast_days=10&timezone=auto`,{signal:AbortSignal.timeout(12000)})).json();
 const H=j.hourly;if(!H)throw 0;
 const T=Object.keys(H).filter(k=>k.startsWith('temperature_2m')),P=Object.keys(H).filter(k=>k.startsWith('precipitation'));
 if(!T.length)throw 0;
 const m=new Map();
 H.time.forEach((t,i)=>{const tv=T.map(k=>H[k][i]).filter(x=>x!=null),pv=P.map(k=>H[k][i]).filter(x=>x!=null);
  if(!tv.length)return;
  m.set(t.slice(0,13),{t:avg(tv),r:pv.length?avg(pv):null,p:pv.length?pv.filter(x=>x>=.1).length/pv.length:null})});
 return m}
async function more(){
 const q=`latitude=${place.lat}&longitude=${place.lon}`,o={signal:AbortSignal.timeout(8000)};
 const[w,a]=await Promise.allSettled([
  fetch(`https://api.open-meteo.com/v1/forecast?${q}&hourly=temperature_2m,surface_pressure,uv_index&daily=sunrise,sunset,uv_index_max&past_days=1&forecast_days=3&timezone=auto`,o).then(r=>r.json()),
  fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=us_aqi,pm2_5&timezone=auto`,o).then(r=>r.json())]);
 return{w:w.value,a:a.value}}
async function load(){
 document.documentElement.classList.remove('menu');
 $('#app').innerHTML='<div id="err">Checking every source…</div>';
 const url=l=>`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&hourly=${VARS.join()}&models=${l.join()}&forecast_days=10&timezone=auto`;
 const om=async l=>{const r=await fetch(url(l));if(!r.ok)throw 0;return[await r.json(),l]};
 try{
  const[d,l]=await om(ALL).catch(()=>om(MODELS));
  const rs=await Promise.allSettled([metno(d.utc_offset_seconds),wttr(),...ENS.map(ens)]);
  const ex=rs.filter(r=>r.status==='fulfilled').map(r=>r.value);
  data=process(d,ex,l);data.x=await more().catch(()=>({}));
  localStorage.setItem('cache',JSON.stringify({place,data,at:Date.now()}));
  render();
 }catch(e){
  const c=JSON.parse(localStorage.getItem('cache')||'null');
  if(c){data=c.data;render('Offline — showing last update');}
  else $('#app').innerHTML='<div id="err">Could not load the forecast. Check your connection and tap 📍 to retry.</div>';
 }
}

function process(d,ex,list){
 const H=d.hourly,n=H.time.length;
 const ms=list.filter(m=>H['temperature_2m_'+m]&&H['temperature_2m_'+m].some(x=>x!=null));
 const v=(k,i)=>ms.map(m=>H[k+'_'+m]?.[i]).filter(x=>x!=null);
 const hours=[];
 for(let i=0;i<n;i++){
  const e=ex.map(m=>m.get(H.time[i].slice(0,13))).filter(Boolean);
  const gx=k=>e.map(x=>x[k]).filter(x=>x!=null);

  hours.push({time:H.time[i],temp:avg(t),spread:sd(t),feels:fl.length?avg(fl):avg(t),hum:hu.length?avg(hu):0,wind:wd.length?avg(wd):0,
   rain:pr.length?avg(pr):0,prob:vt.length?avg(vt):0,code:cd.length?mode(cd):0,n:t.length});
 }
 const days={};
 hours.forEach((h,idx)=>{const k=h.time.slice(0,10);(days[k]=days[k]||[]).push(idx)});

  const hs=ix.map(i=>hours[i]);
  const per=ms.map(m=>{const s=ix.map(i=>H['precipitation_'+m]?.[i]).filter(x=>x!=null);return s.length?s.reduce((a,b)=>a+b,0):null}).filter(x=>x!=null);

  ex.forEach(m=>{let n=0,sm=0;dk.forEach(k=>{const x=m.get(k);if(x&&x.r!=null){n++;sm+=x.r}});if(n>=20)per.push(sm)});

function summary(){

}

  el.style.transform=`translateX(${o*-12}%) scale(${1-a*.06})`;el.style.opacity=1-a*.6;pg.classList.toggle('act',i===idx)});

}

}
